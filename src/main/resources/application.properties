spring.application.name=leetcode-review-api

# ==================== 数据源 ====================
# allowPublicKeyRetrieval=true：MySQL 8/9 用 caching_sha2_password，非 SSL 连接下必须加，否则报
# "Public Key Retrieval is not allowed"
spring.datasource.url=jdbc:mysql://localhost:3306/leetcode_review?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis ====================
# Mapper XML 的位置
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类包名，XML 里可以直接写类名不用写全限定名
mybatis.type-aliases-package=com.wl.leetcodereviewapi.entity
# 开启下划线转驼峰：created_at -> createdAt（不加这个字段全是 null）
mybatis.configuration.map-underscore-to-camel-case=true